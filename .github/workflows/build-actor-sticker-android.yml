name: Build Actor Sticker Android APK v0.2

on:
  push:
    branches: [ actor-sticker-android-apk-v0.2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "system-images;android-29;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK structure and signature
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee apk-permissions.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 8
          if grep -q android.permission.INTERNET apk-permissions.txt; then
            echo "Unexpected INTERNET permission"
            exit 1
          fi
      - name: Upload verified APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: ActorStickerCutterAndroid-v0.2.0-APK-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-permissions.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 7
      - name: Emulator install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb wait-for-device
            sleep 20
            adb shell getprop sys.boot_completed | tee emulator-boot.txt
            adb shell service check package | tee emulator-package-service.txt
            adb logcat -c
            adb push app/build/outputs/apk/debug/app-debug.apk /data/local/tmp/actor-sticker.apk | tee emulator-push.txt
            adb shell pm install -r /data/local/tmp/actor-sticker.apk | tee emulator-install.txt || (sleep 20 && adb shell pm install -r /data/local/tmp/actor-sticker.apk | tee emulator-install.txt)
            grep -q Success emulator-install.txt
            adb shell pm list packages | grep -q com.mhsx.actorsticker
            adb shell am force-stop com.mhsx.actorsticker
            adb shell am start -n com.mhsx.actorsticker/.MainActivity | tee emulator-launch.txt
            sleep 12
            adb shell pidof com.mhsx.actorsticker | tee emulator-pid.txt
            test -s emulator-pid.txt
            adb shell dumpsys activity activities | grep -q com.mhsx.actorsticker
            adb exec-out screencap -p > emulator-screen.png
            test -s emulator-screen.png
            adb logcat -d -t 1200 > emulator-logcat.txt
            ! grep -E "FATAL EXCEPTION|Process: com\.mhsx\.actorsticker.*has died|AndroidRuntime.*FATAL" emulator-logcat.txt
            echo "Emulator install/launch smoke test passed" | tee emulator-result.txt
      - name: Upload emulator test evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ActorStickerCutterAndroid-v0.2.0-emulator-evidence
          path: |
            emulator-boot.txt
            emulator-package-service.txt
            emulator-push.txt
            emulator-install.txt
            emulator-launch.txt
            emulator-pid.txt
            emulator-logcat.txt
            emulator-screen.png
            emulator-result.txt
          if-no-files-found: warn
          retention-days: 7
