name: Build Actor Sticker Android APK v0.6

on:
  push:
    branches: [ actor-sticker-android-apk-v0.6 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "system-images;android-29;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply v0.6 intelligence patches
        run: |
          python3 tools/patch_v050.py
          grep -q 'V050ExportPolicy.requestedBitrate' app/src/main/java/com/mhsx/actorsticker/MainActivityV040.java
          grep -q 'V060TrackRefiner.refine' app/src/main/java/com/mhsx/actorsticker/MainActivityV040.java
          grep -q 'V060MomentClassifier.accept' app/src/main/java/com/mhsx/actorsticker/MainActivityV040.java
          grep -q 'best_only_v060' app/src/main/java/com/mhsx/actorsticker/MainActivityV040.java
          grep -q 'smart_sampler_v060' app/src/main/java/com/mhsx/actorsticker/BackgroundScanService.java
          grep -q 'V060AlignedDescriptor' app/src/main/java/com/mhsx/actorsticker/BackgroundScanService.java
          grep -q 'LANDMARK_MODE_ALL' app/src/main/java/com/mhsx/actorsticker/FaceEngine.java

      - name: Static v0.6 guards
        run: |
          grep -q "versionName '0.6.0'" app/build.gradle
          grep -q 'MainActivityV060' app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_MEDIA_PROCESSING' app/src/main/AndroidManifest.xml
          grep -q 'ic_actor_sticker' app/src/main/AndroidManifest.xml
          grep -q 'language_v060' app/src/main/java/com/mhsx/actorsticker/MainActivityV060.java
          grep -q 'theme_v060' app/src/main/java/com/mhsx/actorsticker/MainActivityV060.java
          grep -q 'Dense identity-locked tracking' app/src/main/java/com/mhsx/actorsticker/MainActivityV060.java
          grep -q 'ConfidenceTimeline' app/src/main/java/com/mhsx/actorsticker/MainActivityV060.java
          grep -q 'V060Learning' app/src/main/java/com/mhsx/actorsticker/MainActivityV060.java
          grep -q 'configureV060' app/src/main/java/com/mhsx/actorsticker/TrackingPanEffect.java
          grep -q 'Look room' app/src/main/java/com/mhsx/actorsticker/TrackingPanEffect.java
          grep -q 'V060AlignedDescriptor' app/src/main/java/com/mhsx/actorsticker/V060TrackRefiner.java

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature alignment launcher icon and permissions
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee apk-permissions.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 12
          grep -q "versionName='0.6.0'" apk-badging.txt
          grep -q "launchable-activity: name='com.mhsx.actorsticker.MainActivityV060'" apk-badging.txt
          grep -q 'application-icon' apk-badging.txt
          grep -q 'android.permission.FOREGROUND_SERVICE' apk-permissions.txt
          if grep -q android.permission.INTERNET apk-permissions.txt; then echo "Unexpected INTERNET permission"; exit 1; fi
          if grep -q android.permission.ACCESS_NETWORK_STATE apk-permissions.txt; then echo "Unexpected network-state permission"; exit 1; fi

      - name: Upload verified v0.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: ActorStickerCutterAndroid-v0.6.0-Modern-Multilingual-APK-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-permissions.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Emulator install and launch smoke test
        continue-on-error: true
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb wait-for-device
            adb logcat -c
            adb push app/build/outputs/apk/debug/app-debug.apk /data/local/tmp/actor-sticker-v060.apk | tee emulator-push.txt
            adb shell pm install -r /data/local/tmp/actor-sticker-v060.apk | tee emulator-install.txt
            grep -q Success emulator-install.txt
            adb shell am force-stop com.mhsx.actorsticker
            adb shell am start -W -n com.mhsx.actorsticker/.MainActivityV060 | tee emulator-launch.txt
            sleep 8
            adb shell pidof com.mhsx.actorsticker | tee emulator-pid.txt
            test -s emulator-pid.txt
            adb exec-out screencap -p > emulator-screen.png
            test -s emulator-screen.png
            adb logcat -d -t 1800 > emulator-logcat.txt
            ! grep -E "FATAL EXCEPTION|Process: com\.mhsx\.actorsticker.*has died|AndroidRuntime.*FATAL" emulator-logcat.txt
            echo "Emulator install/launch smoke test passed" | tee emulator-result.txt

      - name: Upload emulator evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ActorStickerCutterAndroid-v0.6.0-emulator-evidence
          path: |
            emulator-push.txt
            emulator-install.txt
            emulator-launch.txt
            emulator-pid.txt
            emulator-logcat.txt
            emulator-screen.png
            emulator-result.txt
          if-no-files-found: warn
          retention-days: 7
