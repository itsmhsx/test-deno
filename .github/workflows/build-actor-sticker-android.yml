name: Build Actor Sticker Android APK

on:
  push:
    branches: [ actor-sticker-android-apk-v0.1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "system-images;android-29;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/aapt" dump badging "$APK" | tee apk-badging.txt
          sha256sum "$APK" | tee apk-sha256.txt
          unzip -t "$APK" | tail -n 5
      - name: Emulator install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -e
            APK=app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb install -r "$APK" | tee emulator-install.txt
            adb shell am force-stop com.mhsx.actorsticker || true
            adb shell am start -W -n com.mhsx.actorsticker/.MainActivity | tee emulator-launch.txt
            sleep 5
            adb shell pidof com.mhsx.actorsticker | tee emulator-pid.txt
            test -s emulator-pid.txt
            adb logcat -d -t 500 > emulator-logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com\.mhsx\.actorsticker" emulator-logcat.txt; then
              echo "App crash detected in logcat"
              exit 1
            fi
            echo "Emulator smoke test passed"
      - uses: actions/upload-artifact@v4
        with:
          name: ActorStickerCutterAndroid-v0.1.0-APK-tested
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-sha256.txt
            emulator-install.txt
            emulator-launch.txt
            emulator-pid.txt
            emulator-logcat.txt
          if-no-files-found: error
          retention-days: 7
