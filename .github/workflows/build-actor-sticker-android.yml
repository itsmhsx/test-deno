name: Build Actor Sticker Android APK v0.7

on:
  push:
    branches: [ actor-sticker-android-apk-v0.7 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 52
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "system-images;android-29;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply v0.7 intelligence stability and performance patches
        run: |
          python3 tools/patch_v050.py
          python3 tools/patch_v061.py
          python3 tools/patch_v070.py
          grep -q 'V060TrackRefiner.refine' app/src/main/java/com/mhsx/actorsticker/MainActivityV040.java
          grep -q 'configureMotion' app/src/main/java/com/mhsx/actorsticker/TrackingPanEffect.java
          grep -q 'V070Scanner.run' app/src/main/java/com/mhsx/actorsticker/BackgroundScanService.java
          grep -q 'V070ExportPolicy.shouldDenseTrack' app/src/main/java/com/mhsx/actorsticker/MainActivityV040.java
          grep -q 'experimentalSetTrimOptimizationEnabled' app/src/main/java/com/mhsx/actorsticker/MainActivityV040.java
          grep -q 'experimentalSetMaxFramesInEncoder' app/src/main/java/com/mhsx/actorsticker/MainActivityV040.java
          grep -q 'V070ThumbnailLoader.load' app/src/main/java/com/mhsx/actorsticker/MainActivity.java

      - name: Static v0.7 guards
        run: |
          grep -q "compileSdk 36" app/build.gradle
          grep -q "versionName '0.7.0'" app/build.gradle
          grep -q "media3-common:1.10.1" app/build.gradle
          grep -q "media3-inspector-frame:1.10.1" app/build.gradle
          grep -q "com.android.application' version '8.10.1" build.gradle
          grep -q 'MainActivityV070' app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_MEDIA_PROCESSING' app/src/main/AndroidManifest.xml
          grep -q 'speed_mode_v070' app/src/main/java/com/mhsx/actorsticker/MainActivityV070.java
          grep -q 'Performance Dashboard' app/src/main/java/com/mhsx/actorsticker/MainActivityV070.java
          grep -q 'FrameExtractor' app/src/main/java/com/mhsx/actorsticker/V070FrameSampler.java
          grep -q 'SeekParameters.CLOSEST_SYNC' app/src/main/java/com/mhsx/actorsticker/V070FrameSampler.java
          grep -q 'Presentation.createForHeight' app/src/main/java/com/mhsx/actorsticker/V070FrameSampler.java
          grep -q 'LANDMARK_MODE_NONE' app/src/main/java/com/mhsx/actorsticker/V070QuickFaceDetector.java
          grep -q 'twoPass070' app/src/main/java/com/mhsx/actorsticker/V070Scanner.java
          grep -q 'incremental_cache_v070' app/src/main/java/com/mhsx/actorsticker/V070Scanner.java
          grep -q 'V070IndexDb' app/src/main/java/com/mhsx/actorsticker/V070Scanner.java
          grep -q 'hasHardware' app/src/main/java/com/mhsx/actorsticker/V070CodecAdvisor.java
          test -s app/src/main/baseline-prof.txt

      - name: Build debug APK and R8 release smoke
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature alignment launcher icon and permissions
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee apk-permissions.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 12
          grep -q "versionName='0.7.0'" apk-badging.txt
          grep -q "launchable-activity: name='com.mhsx.actorsticker.MainActivityV070'" apk-badging.txt
          grep -q 'application-icon' apk-badging.txt
          grep -q 'android.permission.FOREGROUND_SERVICE' apk-permissions.txt
          if grep -q android.permission.INTERNET apk-permissions.txt; then echo "Unexpected INTERNET permission"; exit 1; fi
          if grep -q android.permission.ACCESS_NETWORK_STATE apk-permissions.txt; then echo "Unexpected network-state permission"; exit 1; fi

      - name: Upload verified v0.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: ActorStickerCutterAndroid-v0.7.0-Performance-APK-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-permissions.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Emulator install and launch smoke test
        continue-on-error: true
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb wait-for-device
            adb logcat -c
            adb push app/build/outputs/apk/debug/app-debug.apk /data/local/tmp/actor-sticker-v070.apk | tee emulator-push.txt
            adb shell pm install -r /data/local/tmp/actor-sticker-v070.apk | tee emulator-install.txt
            grep -q Success emulator-install.txt
            adb shell am force-stop com.mhsx.actorsticker
            adb shell am start -W -n com.mhsx.actorsticker/.MainActivityV070 | tee emulator-launch.txt
            sleep 8
            adb shell pidof com.mhsx.actorsticker | tee emulator-pid.txt
            test -s emulator-pid.txt
            adb exec-out screencap -p > emulator-screen.png
            test -s emulator-screen.png
            adb logcat -d -t 1800 > emulator-logcat.txt
            ! grep -E "FATAL EXCEPTION|Process: com\.mhsx\.actorsticker.*has died|AndroidRuntime.*FATAL" emulator-logcat.txt
            echo "Emulator install/launch smoke test passed" | tee emulator-result.txt

      - name: Upload emulator evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ActorStickerCutterAndroid-v0.7.0-emulator-evidence
          path: |
            emulator-push.txt
            emulator-install.txt
            emulator-launch.txt
            emulator-pid.txt
            emulator-logcat.txt
            emulator-screen.png
            emulator-result.txt
          if-no-files-found: warn
          retention-days: 7
