name: Build Actor Sticker Android APK v0.8

on:
  push:
    branches: [ actor-sticker-android-apk-v0.8 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "system-images;android-29;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fetch pinned offline MobileFaceNet model
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 4 --retry-delay 2 \
            "https://raw.githubusercontent.com/hugocornellier/face_detection_tflite/50c784adaa9f40c722affb1d4412674f25e1fe0c/assets/models/mobilefacenet.tflite" \
            -o app/src/main/assets/models/mobilefacenet.tflite
          test -s app/src/main/assets/models/mobilefacenet.tflite
          test "$(stat -c%s app/src/main/assets/models/mobilefacenet.tflite)" -gt 500000
          sha256sum app/src/main/assets/models/mobilefacenet.tflite | tee model-sha256.txt

      - name: Apply v0.8 compatibility intelligence and performance patches
        run: |
          python3 tools/patch_v050.py
          python3 tools/patch_v061.py
          python3 tools/patch_v070.py
          python3 tools/patch_v080.py
          grep -q 'configureMotion' app/src/main/java/com/mhsx/actorsticker/TrackingPanEffect.java
          grep -q 'V080FaceEmbedder.embedding' app/src/main/java/com/mhsx/actorsticker/FaceEngine.java
          grep -q 'FORMAT_VERSION = 6' app/src/main/java/com/mhsx/actorsticker/ActorScanStore.java
          grep -q 'FRAGMENT_FORMAT = 2' app/src/main/java/com/mhsx/actorsticker/V070Scanner.java
          grep -q 'MainActivityV080.class' app/src/main/java/com/mhsx/actorsticker/BackgroundScanService.java

      - name: Static v0.8 feature guards
        run: |
          grep -q "compileSdk 36" app/build.gradle
          grep -q "versionCode 10" app/build.gradle
          grep -q "versionName '0.8.0'" app/build.gradle
          grep -q "tensorflow-lite:2.16.1" app/build.gradle
          grep -q "media3-common:1.10.1" app/build.gradle
          grep -q 'MainActivityV080' app/src/main/AndroidManifest.xml
          grep -q 'V080ExportService' app/src/main/AndroidManifest.xml
          grep -q 'V080App' app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_MEDIA_PROCESSING' app/src/main/AndroidManifest.xml
          grep -q '192' app/src/main/java/com/mhsx/actorsticker/V080FaceEmbedder.java
          grep -q 'mergeSelected' app/src/main/java/com/mhsx/actorsticker/MainActivityV080.java
          grep -q 'splitSelected' app/src/main/java/com/mhsx/actorsticker/MainActivityV080.java
          grep -q 'v080_multi_mode' app/src/main/java/com/mhsx/actorsticker/MainActivityV080.java
          grep -q 'safe_zone' app/src/main/java/com/mhsx/actorsticker/MainActivityV080.java
          grep -q 'dedupe' app/src/main/java/com/mhsx/actorsticker/V080SceneAnalyzer.java
          grep -q 'recentProjectKeys' app/src/main/java/com/mhsx/actorsticker/V080StudioStore.java
          grep -q 'resetInterrupted' app/src/main/java/com/mhsx/actorsticker/V080ExportQueue.java
          grep -q 'Before / After Preview' app/src/main/java/com/mhsx/actorsticker/MainActivityV080.java
          grep -q 'bestMoment' app/src/main/java/com/mhsx/actorsticker/V080SceneAnalyzer.java
          grep -q 'momentLabel' app/src/main/java/com/mhsx/actorsticker/V080SceneAnalyzer.java
          grep -q 'Advanced Actor Gallery' app/src/main/java/com/mhsx/actorsticker/MainActivityV080.java
          grep -q 'Storage Manager' app/src/main/java/com/mhsx/actorsticker/MainActivityV080.java
          grep -q 'Auto Performance Tuner' app/src/main/java/com/mhsx/actorsticker/MainActivityV080.java
          grep -q 'Telegram Sticker Video' app/src/main/java/com/mhsx/actorsticker/MainActivityV080.java
          grep -q 'Smart Suggestions' app/src/main/java/com/mhsx/actorsticker/MainActivityV080.java
          test -s app/src/main/baseline-prof.txt
          test -s app/src/main/assets/models/MOBILEFACENET_NOTICE.txt

      - name: Build debug APK and R8 release smoke
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature alignment model launcher icon and permissions
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee apk-permissions.txt
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee apk-files.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 12
          grep -q "versionName='0.8.0'" apk-badging.txt
          grep -q "launchable-activity: name='com.mhsx.actorsticker.MainActivityV080'" apk-badging.txt
          grep -q 'application-icon' apk-badging.txt
          grep -q 'assets/models/mobilefacenet.tflite' apk-files.txt
          grep -q 'assets/models/MOBILEFACENET_NOTICE.txt' apk-files.txt
          grep -q 'android.permission.FOREGROUND_SERVICE' apk-permissions.txt
          if grep -q android.permission.INTERNET apk-permissions.txt; then echo "Unexpected INTERNET permission"; exit 1; fi
          if grep -q android.permission.ACCESS_NETWORK_STATE apk-permissions.txt; then echo "Unexpected network-state permission"; exit 1; fi

      - name: Upload verified v0.8 APK
        uses: actions/upload-artifact@v4
        with:
          name: ActorStickerCutterAndroid-v0.8.0-FullUpgrade-APK-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-permissions.txt
            apk-sha256.txt
            model-sha256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Emulator install and launch smoke test
        continue-on-error: true
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb wait-for-device
            adb logcat -c
            adb push app/build/outputs/apk/debug/app-debug.apk /data/local/tmp/actor-sticker-v080.apk | tee emulator-push.txt
            adb shell pm install -r /data/local/tmp/actor-sticker-v080.apk | tee emulator-install.txt
            grep -q Success emulator-install.txt
            adb shell am force-stop com.mhsx.actorsticker
            adb shell am start -W -n com.mhsx.actorsticker/.MainActivityV080 | tee emulator-launch.txt
            sleep 9
            adb shell pidof com.mhsx.actorsticker | tee emulator-pid.txt
            test -s emulator-pid.txt
            adb exec-out screencap -p > emulator-screen.png
            test -s emulator-screen.png
            adb logcat -d -t 2200 > emulator-logcat.txt
            ! grep -E "FATAL EXCEPTION|Process: com\.mhsx\.actorsticker.*has died|AndroidRuntime.*FATAL" emulator-logcat.txt
            echo "Emulator install/launch smoke test passed" | tee emulator-result.txt

      - name: Upload emulator evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ActorStickerCutterAndroid-v0.8.0-emulator-evidence
          path: |
            emulator-push.txt
            emulator-install.txt
            emulator-launch.txt
            emulator-pid.txt
            emulator-logcat.txt
            emulator-screen.png
            emulator-result.txt
          if-no-files-found: warn
          retention-days: 7
