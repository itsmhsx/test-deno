name: Build Actor Sticker Android APK v0.4

on:
  push:
    branches: [ actor-sticker-android-apk-v0.4 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "system-images;android-29;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply Max Quality build policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/mhsx/actorsticker/MainActivityV040.java')
          s = p.read_text()
          old = '''int shortSide = Math.max(360, Math.min(s.sourceWidth(), s.sourceHeight()));\n                    int bitrate = recommendedBitrate(shortSide);'''
          new = '''// Max Quality: request a high VBR-compatible bitrate first.\n                    // If a device encoder rejects it, exportTracked automatically retries with Media3 defaults.\n                    int bitrate = 28_000_000;'''
          if old not in s:
              raise SystemExit('Max Quality source pattern not found')
          p.write_text(s.replace(old, new))
          PY
          grep -q 'int bitrate = 28_000_000' app/src/main/java/com/mhsx/actorsticker/MainActivityV040.java
      - name: Static v0.4 guards
        run: |
          grep -q "versionName '0.4.0'" app/build.gradle
          grep -q 'MainActivityV040Final' app/src/main/AndroidManifest.xml
          grep -q 'App version: 0.4.0' app/src/main/java/com/mhsx/actorsticker/MainActivityV040Final.java
          grep -q 'clip_seconds' app/src/main/java/com/mhsx/actorsticker/MainActivityV040.java
          grep -q 'Smart face-following pan' app/src/main/java/com/mhsx/actorsticker/MainActivityV040.java
          grep -q 'int bitrate = 28_000_000' app/src/main/java/com/mhsx/actorsticker/MainActivityV040.java
          grep -q 'TrackingPanEffect' app/src/main/java/com/mhsx/actorsticker/MainActivityV040.java
          grep -q 'nearestHitDistance' app/src/main/java/com/mhsx/actorsticker/TrackingPanEffect.java
          grep -q 'MIN_CLIP_MS = 2000L' app/src/main/java/com/mhsx/actorsticker/MainActivityV040.java
          grep -q 'actor_cache' app/src/main/java/com/mhsx/actorsticker/ActorScanStore.java
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK structure signature and permissions
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee apk-permissions.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 10
          grep -q "versionName='0.4.0'" apk-badging.txt
          grep -q "launchable-activity: name='com.mhsx.actorsticker.MainActivityV040Final'" apk-badging.txt
          if grep -q android.permission.INTERNET apk-permissions.txt; then
            echo "Unexpected INTERNET permission"
            exit 1
          fi
      - name: Upload verified v0.4 final APK
        uses: actions/upload-artifact@v4
        with:
          name: ActorStickerCutterAndroid-v0.4.0-FINAL-SmartTracking-MaxQuality
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-permissions.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 7
      - name: Emulator install and launch smoke test
        continue-on-error: true
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb wait-for-device
            adb logcat -c
            adb push app/build/outputs/apk/debug/app-debug.apk /data/local/tmp/actor-sticker.apk | tee emulator-push.txt
            adb shell pm install -r /data/local/tmp/actor-sticker.apk | tee emulator-install.txt
            grep -q Success emulator-install.txt
            adb shell am force-stop com.mhsx.actorsticker
            adb shell am start -n com.mhsx.actorsticker/.MainActivityV040Final | tee emulator-launch.txt
            sleep 10
            adb shell pidof com.mhsx.actorsticker | tee emulator-pid.txt
            test -s emulator-pid.txt
            adb exec-out screencap -p > emulator-screen.png
            test -s emulator-screen.png
            adb logcat -d -t 1500 > emulator-logcat.txt
            ! grep -E "FATAL EXCEPTION|Process: com\.mhsx\.actorsticker.*has died|AndroidRuntime.*FATAL" emulator-logcat.txt
            echo "Emulator install/launch smoke test passed" | tee emulator-result.txt
      - name: Upload emulator evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ActorStickerCutterAndroid-v0.4.0-FINAL-emulator-evidence
          path: |
            emulator-push.txt
            emulator-install.txt
            emulator-launch.txt
            emulator-pid.txt
            emulator-logcat.txt
            emulator-screen.png
            emulator-result.txt
          if-no-files-found: warn
          retention-days: 7
