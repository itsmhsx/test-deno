name: Build Actor Sticker Android APK v1.0 Final

on:
  push:
    branches: [ actor-sticker-android-apk-v1.0 ]
  workflow_dispatch:

jobs:
  build-final:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "system-images;android-29;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch pinned offline MobileFaceNet model
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 4 --retry-delay 2 \
            "https://raw.githubusercontent.com/hugocornellier/face_detection_tflite/50c784adaa9f40c722affb1d4412674f25e1fe0c/assets/models/mobilefacenet.tflite" \
            -o app/src/main/assets/models/mobilefacenet.tflite
          test -s app/src/main/assets/models/mobilefacenet.tflite
          test "$(stat -c%s app/src/main/assets/models/mobilefacenet.tflite)" -gt 500000
          sha256sum app/src/main/assets/models/mobilefacenet.tflite | tee model-sha256.txt
      - name: Apply all production patches
        run: |
          python3 tools/patch_v050.py
          python3 tools/patch_v061.py
          python3 tools/patch_v070.py
          python3 tools/patch_v080.py
          python3 tools/patch_v081.py
          python3 tools/patch_v090.py
          python3 tools/patch_v100.py
          python3 tools/patch_v100_cinematic.py
      - name: Static final guards
        run: |
          grep -q "versionCode 13" app/build.gradle
          grep -q "versionName '1.0.0'" app/build.gradle
          grep -q "androidx.work:work-runtime" app/build.gradle
          grep -q 'MainActivityV100' app/src/main/AndroidManifest.xml
          grep -q 'v090_face_follow_enabled",false' app/src/main/java/com/mhsx/actorsticker/MainActivityV100.java
          grep -q 'Fixed actor average' app/src/main/java/com/mhsx/actorsticker/MainActivityV100.java
          grep -q 'setPolyToPoly' app/src/main/java/com/mhsx/actorsticker/V100IdentityEngine.java
          grep -q 'hard negative' app/src/main/java/com/mhsx/actorsticker/V100IdentityEngine.java
          grep -q 'markNeedsReview' app/src/main/java/com/mhsx/actorsticker/V100IdentityEngine.java
          grep -q 'V100IdentityEngine.alignedEmbedding' app/src/main/java/com/mhsx/actorsticker/V070Scanner.java
          grep -q 'lucasKanade' app/src/main/java/com/mhsx/actorsticker/V100MotionEngine.java
          grep -q 'bodyHistogram' app/src/main/java/com/mhsx/actorsticker/V100MotionEngine.java
          grep -q 'V100MotionEngine.refine' app/src/main/java/com/mhsx/actorsticker/V080ExportService.java
          grep -q 'cineVx' app/src/main/java/com/mhsx/actorsticker/TrackingPanEffect.java
          grep -q 'Keyframe Tracking Editor' app/src/main/java/com/mhsx/actorsticker/MainActivityV100.java
          grep -q 'WYSIWYG Preview' app/src/main/java/com/mhsx/actorsticker/MainActivityV100.java
          grep -q 'benchCodec' app/src/main/java/com/mhsx/actorsticker/V100PerformanceKit.java
          grep -q 'WorkManager' app/src/main/java/com/mhsx/actorsticker/V100RecoveryWorker.java
          grep -q 'regression(Context' app/src/main/java/com/mhsx/actorsticker/V100PerformanceKit.java
          grep -q 'accuracyReport' app/src/main/java/com/mhsx/actorsticker/V100PerformanceKit.java
          grep -q 'Repair complete' app/src/main/java/com/mhsx/actorsticker/V100ProjectRepair.java
          grep -q 'MainActivityV100' app/src/main/baseline-prof.txt
      - name: Build debug APK and R8 release smoke
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify final APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee apk-permissions.txt
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee apk-files.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 12
          grep -q "versionName='1.0.0'" apk-badging.txt
          grep -q "launchable-activity: name='com.mhsx.actorsticker.MainActivityV100'" apk-badging.txt
          grep -q 'assets/models/mobilefacenet.tflite' apk-files.txt
          grep -q 'android.permission.FOREGROUND_SERVICE' apk-permissions.txt
          if grep -q android.permission.INTERNET apk-permissions.txt; then exit 1; fi
          if grep -q android.permission.ACCESS_NETWORK_STATE apk-permissions.txt; then exit 1; fi
      - name: Upload verified final APK
        uses: actions/upload-artifact@v4
        with:
          name: ActorStickerCutterAndroid-v1.0.0-Production-FINAL-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-permissions.txt
            apk-sha256.txt
            model-sha256.txt
          if-no-files-found: error
          retention-days: 7
      - name: Emulator install and launch smoke test
        continue-on-error: true
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb wait-for-device
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk | tee emulator-install.txt
            grep -q Success emulator-install.txt
            adb shell am force-stop com.mhsx.actorsticker
            adb shell am start -W -n com.mhsx.actorsticker/.MainActivityV100 | tee emulator-launch.txt
            sleep 12
            adb shell pidof com.mhsx.actorsticker | tee emulator-pid.txt
            test -s emulator-pid.txt
            adb logcat -d -t 3200 > emulator-logcat.txt
            ! grep -E "FATAL EXCEPTION|Process: com\.mhsx\.actorsticker.*has died|AndroidRuntime.*FATAL" emulator-logcat.txt
            echo "Emulator install/launch smoke test passed" | tee emulator-result.txt
      - name: Upload emulator evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ActorStickerCutterAndroid-v1.0.0-FINAL-emulator-evidence
          path: |
            emulator-install.txt
            emulator-launch.txt
            emulator-pid.txt
            emulator-logcat.txt
            emulator-result.txt
          if-no-files-found: warn
          retention-days: 7
